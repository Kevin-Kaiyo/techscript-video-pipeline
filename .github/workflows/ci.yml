name: CI/CD — Micro LED Video Project

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate project structure
        run: |
          echo "✅ Checking required files..."
          test -f README.md && echo "README.md ✅"
          test -f PROJECT.md && echo "PROJECT.md ✅"
          test -f .openclaw/project.json && echo ".openclaw/project.json ✅"
          test -f scripts/ep01_intro.md && echo "EP01 script ✅"
          echo "All checks passed!"
