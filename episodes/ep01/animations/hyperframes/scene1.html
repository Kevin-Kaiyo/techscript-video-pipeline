<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;700;900&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #000; }
      #stage {
        position: relative; width: 1920px; height: 1080px; overflow: hidden;
        font-family: "Noto Sans SC", sans-serif;
        background: radial-gradient(ellipse at 30% 50%, #001a3d 0%, #000510 60%, #000 100%);
      }
      #grid {
        position: absolute; inset: 0;
        background-image:
          linear-gradient(rgba(0,150,255,0.07) 1px, transparent 1px),
          linear-gradient(90deg, rgba(0,150,255,0.07) 1px, transparent 1px);
        background-size: 80px 80px; z-index: 1;
      }
      .pixel-dot { position: absolute; border-radius: 50%; z-index: 2; }
      #phone {
        position: absolute; left: 200px; top: 140px; width: 260px; height: 520px;
        border: 3px solid rgba(0,150,255,0.5); border-radius: 36px;
        box-shadow: 0 0 40px rgba(0,120,255,0.3); z-index: 10;
      }
      #phone-screen {
        position: absolute; inset: 20px; border-radius: 24px;
        background: linear-gradient(135deg, #001133 0%, #002266 50%, #001133 100%); overflow: hidden;
      }
      #phone-pixels { display: grid; grid-template-columns: repeat(8, 1fr); gap: 3px; padding: 16px; width: 100%; height: 100%; }
      .px-cell { border-radius: 2px; }
      #question { position: absolute; left: 560px; top: 260px; width: 1100px; z-index: 10; }
      #question .line1 { font-size: 68px; font-weight: 300; color: rgba(255,255,255,0.85); letter-spacing: 4px; margin-bottom: 20px; }
      #question .line2 { font-size: 82px; font-weight: 700; color: #fff; letter-spacing: 2px; line-height: 1.3; }
      #question .highlight { color: #00ccff; text-shadow: 0 0 30px rgba(0,200,255,0.6); }
      #subtitle {
        position: absolute; bottom: 80px; left: 50%;
        font-size: 44px; color: #fff; text-shadow: 0 2px 8px rgba(0,0,0,0.8);
        letter-spacing: 3px; white-space: nowrap; z-index: 20;
      }
    </style>
  </head>
  <body>
    <div id="stage"
      data-composition-id="microled-scene1"
      data-start="0" data-duration="8"
      data-width="1920" data-height="1080"
    >
      <div id="grid"></div>
      <div id="dots"></div>
      <div id="phone">
        <div id="phone-screen"><div id="phone-pixels"></div></div>
      </div>
      <div id="question">
        <div class="line1">你有没有想过</div>
        <div class="line2">手机屏幕里的<span class="highlight">「光」</span><br>是怎么来的？</div>
      </div>
      <div id="subtitle"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      function mulberry32(seed) {
        return function() {
          seed |= 0; seed = seed + 0x6D2B79F5 | 0;
          var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
          t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
          return ((t ^ t >>> 14) >>> 0) / 4294967296;
        };
      }
      const rng = mulberry32(42);
      const dotsContainer = document.getElementById("dots");
      for (let i = 0; i < 30; i++) {
        const d = document.createElement("div");
        d.className = "pixel-dot";
        const size = rng() * 5 + 3;
        d.style.width = size + "px"; d.style.height = size + "px";
        d.style.left = rng() * 1920 + "px"; d.style.top = rng() * 1080 + "px";
        const hue = rng() > 0.5 ? "0,170,255" : "0,220,180";
        d.style.background = `rgb(${hue})`;
        d.style.boxShadow = `0 0 ${size*2}px rgba(${hue},0.9)`;
        d.style.opacity = "0";
        dotsContainer.appendChild(d);
      }
      const pixelGrid = document.getElementById("phone-pixels");
      const colors = ["#ff3366","#00aaff","#00ffaa","#ffcc00","#aa66ff","#00ccff"];
      for (let i = 0; i < 64; i++) {
        const cell = document.createElement("div");
        cell.className = "px-cell";
        cell.style.background = colors[Math.floor(rng() * colors.length)];
        cell.style.aspectRatio = "1"; cell.style.opacity = "0";
        pixelGrid.appendChild(cell);
      }
      const tl = gsap.timeline({ paused: true });
      tl.set("#grid",     { opacity: 0 }, 0);
      tl.set("#phone",    { x: -80, opacity: 0 }, 0);
      tl.set("#question", { x: 60, opacity: 0 }, 0);
      tl.set("#subtitle", { x: "-50%", opacity: 0 }, 0);
      tl.to("#grid", { opacity: 1, duration: 1.5 }, 0);
      const dots = document.querySelectorAll(".pixel-dot");
      dots.forEach((d, i) => {
        const delay = (i % 10) * 0.1;
        const targetOp = (i % 4 + 1) * 0.15;
        tl.to(d, { opacity: targetOp, duration: 0.4, repeat: 9, yoyo: true, delay }, 0);
      });
      tl.to("#phone",    { x: 0, opacity: 1, duration: 1, ease: "power3.out" }, 0.3);
      document.querySelectorAll(".px-cell").forEach((cell, i) => {
        tl.to(cell, { opacity: 1, duration: 0.06 }, 0.5 + i * 0.02);
      });
      tl.to("#question", { x: 0, opacity: 1, duration: 1.2, ease: "power3.out" }, 1.0);
      tl.call(() => {
        document.getElementById("subtitle").textContent = "你有没有想过，手机屏幕里的光是怎么来的？";
      }, [], 1.2);
      tl.to("#subtitle", { opacity: 1, duration: 0.5 }, 1.2);
      tl.to("#subtitle", { opacity: 0, duration: 0.5 }, 7.3);
      window.__timelines["microled-scene1"] = tl;
    </script>
  </body>
</html>
